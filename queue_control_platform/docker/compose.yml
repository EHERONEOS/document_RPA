services:
  mysql:
    image: mysql:8.4
    environment:
      # 2026-10 起：默认库即统一库（旧默认 queue_control 库已废弃，清理见 cleanup_legacy_databases.sql）
      MYSQL_DATABASE: rpa_platform
      MYSQL_USER: queue_control
      MYSQL_PASSWORD: queue_control
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - queue-control-mysql:/var/lib/mysql
      # 统一库初始化（仅空数据卷首次初始化时执行；老数据卷由服务启动时的幂等迁移补齐）
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - queue-control-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  queue-control-mysql:
  queue-control-redis:
