[project]
name = "wise-rpa"
version = "0.1.0"
description = "Distributed RPA workers for carrier document automation"
requires-python = "==3.12.12"
dependencies = [
    "DrissionPage==4.1.1.4",
    "funboost==44.0",
    "numpy==2.5.1",
    "opencv-python==5.0.0.93",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "setuptools==80.10.2",
    "nacos-sdk-python==0.1.7",
    "redis==7.1.0",
    "wise-utils>=1.1.3",
    "imageio-ffmpeg==0.6.0",
    "windows-capture>=1.4.5; sys_platform == 'win32'",
    "dbutils>=3.1.2",
    "async-timeout==5.0.1",
]

[tool.uv]
override-dependencies = [
    "aiohttp==3.14.1",
    "invoke==3.0.3",
    "kafka-python==3.0.8",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
